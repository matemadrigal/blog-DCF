<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCF Valuation Reports - Blog DCF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .report-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .report-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .report-card .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .report-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .report-card .ticker {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .report-card .meta {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .report-card .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e0e7ff;
            color: #667eea;
        }

        .btn-secondary:hover {
            background: #c7d2fe;
        }

        .stats {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .stats h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .stat-item .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-item .label {
            color: #666;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.8;
        }

        footer a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .reports-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 DCF Valuation Reports</h1>
            <p>Análisis de valoración por Flujo de Caja Descontado (DCF)</p>
        </header>

        <div class="stats">
            <h2>📈 Estadísticas</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="number" id="total-reports">4</div>
                    <div class="label">Reportes Publicados</div>
                </div>
                <div class="stat-item">
                    <div class="number">3</div>
                    <div class="label">Sectores Analizados</div>
                </div>
                <div class="stat-item">
                    <div class="number">2024</div>
                    <div class="label">Año</div>
                </div>
            </div>
        </div>

        <div class="reports-grid" id="reports-container">
            <!-- Reports will be dynamically loaded here -->
        </div>

        <footer>
            <p>DCF Valuation Engine &copy; 2024 | <a href="https://github.com/matemadrigal/blog-DCF" target="_blank">GitHub Repository</a></p>
        </footer>
    </div>

    <script>
        // Report data - Add your PDFs here
        const reports = [
            {
                ticker: 'PFE',
                company: 'Pfizer Inc.',
                filename: 'DCF Valuation Report - PFE.pdf',
                sector: 'Healthcare / Pharmaceuticals',
                date: 'Q3 2024',
                size: '442 KB'
            },
            {
                ticker: 'SNY',
                company: 'Sanofi',
                filename: 'DCF_REPORT_SNY_SANOFI.pdf',
                sector: 'Healthcare / Pharmaceuticals',
                date: 'Q3 2024',
                size: '440 KB'
            },
            {
                ticker: 'ADBE',
                company: 'Adobe Inc.',
                filename: 'DCF_Report_ADBE_2025-10-15 (1).pdf',
                sector: 'Technology / Software',
                date: 'October 2025',
                size: '6.6 KB'
            },
            {
                ticker: 'LRCX',
                company: 'Lam Research',
                filename: 'DCF_Report_LRCX_2025-10-15 (1).pdf',
                sector: 'Technology / Semiconductors',
                date: 'October 2025',
                size: '6.6 KB'
            }
        ];

        // Render reports
        const container = document.getElementById('reports-container');

        reports.forEach(report => {
            const card = document.createElement('div');
            card.className = 'report-card';
            card.innerHTML = `
                <div class="icon">📄</div>
                <span class="ticker">${report.ticker}</span>
                <h3>${report.company}</h3>
                <div class="meta">
                    ${report.sector}<br>
                    ${report.date} • ${report.size}
                </div>
                <div class="actions">
                    <a href="reports/${encodeURIComponent(report.filename)}" class="btn btn-primary" target="_blank">Ver PDF</a>
                    <a href="reports/${encodeURIComponent(report.filename)}" class="btn btn-secondary" download>Descargar</a>
                </div>
            `;
            container.appendChild(card);
        });

        // Update total reports count
        document.getElementById('total-reports').textContent = reports.length;
    </script>
</body>
</html>
