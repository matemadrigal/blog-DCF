{% extends "base.html" %}

{% block content %}
<div class="fade-in-up" style="text-align: center; padding: var(--spacing-2xl) 0;">
    <div style="font-size: 8rem; color: var(--lime-dark); margin-bottom: var(--spacing-lg);">
        <i class="fas fa-search"></i>
    </div>

    <h1 style="font-size: 4rem; margin-bottom: var(--spacing-md);">404</h1>
    <h2 style="margin-bottom: var(--spacing-xl);">Página no encontrada</h2>

    <p style="font-size: 1.25rem; color: var(--black-strong); max-width: 600px; margin: 0 auto var(--spacing-2xl);">
        La página que estás buscando no existe. Puede que haya sido movida o eliminada.
    </p>

    <div style="display: flex; gap: var(--spacing-lg); justify-content: center; flex-wrap: wrap;">
        <a href="{{ url_for('home') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> Ir al Inicio
        </a>
        <a href="{{ url_for('analisis') }}" class="btn btn-outline">
            <i class="fas fa-chart-bar"></i> Ir a Análisis
        </a>
    </div>
</div>
{% endblock %}
